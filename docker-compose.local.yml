services:
  backend:
    build:
      context: ./backend

    env_file:
      - .env.local

    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/firebase-service-account.json

    ports:
      - "8080:8080"

    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
      - ./backend/credentials/firebase-service-account.json:/app/credentials/firebase-service-account.json:ro

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: development

    env_file:
      - .env.local

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    depends_on:
      - backend

    restart: unless-stopped

volumes:
  frontend_node_modules: